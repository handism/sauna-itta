default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("POSTGRES_USER", "sauna_itta") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "sauna_itta") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "sauna_itta_development") %>

test:
  <<: *default
  database: sauna_itta_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "sauna_itta_production") %>
