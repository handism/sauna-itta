version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # 個別PRが増えすぎないよう、開発依存（minor/patch）とパッチ更新はまとめる
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-patch:
        update-types: [patch]

  - package-ecosystem: bundler
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly

  # infra/ の Google provider。major 更新は破壊的変更を含むため、
  # versions.tf の制約（~> 6.0）の範囲で上がる分だけを受け取り、major は手動で計画して上げる
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: hashicorp/google
        update-types: ["version-update:semver-major"]
