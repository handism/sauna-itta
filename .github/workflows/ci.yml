name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:local
      - run: npm run build:api

  rails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sauna_itta_test
          POSTGRES_USER: sauna_itta
          POSTGRES_PASSWORD: sauna_itta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sauna_itta -d sauna_itta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      POSTGRES_USER: sauna_itta
      POSTGRES_PASSWORD: sauna_itta
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
          working-directory: backend
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: bundle exec rubocop
      - run: bundle exec brakeman --no-pager

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - name: productionイメージをビルド
        run: docker build -t sauna-itta:ci .
